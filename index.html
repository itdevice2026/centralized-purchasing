<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>All Company Centralized Purchasing System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23c8102e'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>P</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --red:#c8102e; --red-d:#9e0c24; --red-l:#fde8eb; --ink:#1f2328; --muted:#6b7280; --line:#e5e7eb;
  --bg:#f4f5f7; --card:#fff; --green:#15803d; --green-l:#dcfce7; --amber:#b45309; --amber-l:#fef3c7;
  --blue:#1d4ed8; --blue-l:#dbeafe; --gray-l:#f3f4f6; --violet:#6d28d9; --violet-l:#ede9fe;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
/* ---- login ---- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,var(--red) 0%,var(--red-d) 100%)}
.login-card{background:#fff;border-radius:14px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h1{margin:0 0 4px;font-size:20px;color:var(--red)}
.login-card p{margin:0 0 22px;color:var(--muted);font-size:13px}
/* ---- layout ---- */
#app{display:flex;min-height:100%}
.side{width:232px;background:#1b1d22;color:#d1d5db;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:16px 16px 14px;border-bottom:1px solid #2c2f36}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.3px}
.brand span{font-size:11px;color:#9ca3af;letter-spacing:.4px;text-transform:uppercase}
.nav{padding:8px 0;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#6b7280;padding:14px 18px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:#d1d5db;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
.nav a:hover{background:#25282f;color:#fff}
.nav a.on{background:#2a1418;color:#fff;border-left-color:var(--red)}
.nav a .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.who{padding:12px 16px;border-top:1px solid #2c2f36;font-size:12px}
.who b{color:#fff;display:block;font-size:13px}
.who .role{display:inline-block;margin-top:3px;background:#2c2f36;border-radius:4px;padding:1px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.who a{color:#fca5a5;cursor:pointer;text-decoration:none;margin-right:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.topbar h2{margin:0;font-size:18px}
.topbar .sp{flex:1}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.content{padding:20px 22px 40px}
/* ---- ui ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--gray-l)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}.btn.pri:hover{background:var(--red-d)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{background:#fff;border-color:#fca5a5;color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.link{border:none;background:none;color:var(--blue);padding:2px 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea,.inp{border:1px solid #d1d5db;border-radius:7px;padding:8px 10px;background:#fff;width:100%;min-width:0}
.fld textarea{resize:vertical;min-height:60px}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #fecaca;border-color:var(--red)}
.inp[readonly],.fld input[readonly],.fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:var(--gray-l)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#fafafa;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#fff7f8}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
table.t input.inp,table.t select.inp{padding:6px 8px}
table.t tfoot td{font-weight:700;background:#fafafa}
table.t td.bold{white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;text-transform:capitalize;white-space:nowrap}
.b-draft{background:var(--gray-l);color:#374151}.b-pending{background:var(--amber-l);color:var(--amber)}
.b-approved,.b-awarded,.b-received,.b-closed,.b-active{background:var(--green-l);color:var(--green)}
.b-rejected,.b-cancelled,.b-inactive{background:var(--red-l);color:var(--red)}
.b-canvassing,.b-sent,.b-partial{background:var(--blue-l);color:var(--blue)}
.b-ordered{background:var(--violet-l);color:var(--violet)}.b-skipped{background:var(--gray-l);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.kpi:hover{border-color:#fca5a5}
.kpi .n{font-size:26px;font-weight:800;color:var(--red)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.bold{font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .inp{width:auto;min-width:150px}
.doc-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.doc-head h3{margin:0;font-size:18px}
.doc-head .sp{flex:1}
.trail{list-style:none;margin:0;padding:0}
.trail li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:center;flex-wrap:wrap}
.trail li:last-child{border-bottom:none}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{background:var(--amber-l);border:1px solid #fde68a;color:#78350f;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.note.info{background:var(--blue-l);border-color:#bfdbfe;color:#1e3a8a}
.diff td:first-child{color:var(--muted);width:140px}
.diff .chg{background:#fff7ed;font-weight:700}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal header h3{margin:0;font-size:16px;flex:1}
.modal .body{padding:18px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#toast{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#111827;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:13px;max-width:380px}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
.cv-grid td,.cv-grid th{text-align:center}
.cv-grid td:first-child,.cv-grid th:first-child{text-align:left}
.cv-grid .low{background:#f0fdf4}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
@media (max-width:860px){
  .side{position:fixed;left:-240px;z-index:40;transition:left .2s}
  .side.open{left:0}
  .menu-btn{display:inline-block}
  .content{padding:16px}
  .topbar{padding:10px 16px}
}
@media print{.side,.topbar{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hide">
  <form class="login-card" id="loginForm">
    <h1>Centralized Purchasing</h1>
    <p>All Company Purchasing System — Meatplus Group</p>
    <div class="fld" style="margin-bottom:12px"><label>Email</label><input id="lgEmail" type="email" autocomplete="username" required></div>
    <div class="fld" style="margin-bottom:16px"><label>Password</label><input id="lgPass" type="password" autocomplete="current-password" required></div>
    <button class="btn pri" style="width:100%;justify-content:center;padding:10px" id="lgBtn">Sign in</button>
    <div id="lgErr" class="small" style="color:var(--red);margin-top:10px"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hide">
  <aside class="side" id="side">
    <div class="brand"><b>CENTRALIZED PURCHASING</b><span>All Company · Meatplus Group</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <div class="main">
    <div class="topbar"><button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button><h2 id="pageTitle">Dashboard</h2><div class="sp"></div><span id="topActions"></span></div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
// =====================================================================
// CONFIG
// =====================================================================
const SUPABASE_URL = "https://emkcwukiqxnvcbhkjiqz.supabase.co";
const SUPABASE_KEY = "sb_publishable_u_qnmEI8oHI9Z_A0-Hht3Q_Yvaa7Ork";
const FN_ADMIN = SUPABASE_URL + "/functions/v1/pur-admin";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_LABEL = {admin:"Module Admin", purchasing:"Purchasing", requester:"Requester", receiver:"Receiver", viewer:"Viewer"};
const S = { user:null, me:null, companies:[], myCompanyIds:[], depts:[], profiles:{}, items:[], suppliers:[], counts:{} };

// =====================================================================
// UTIL
// =====================================================================
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => Number(v||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const qtyf = v => Number(v||0).toLocaleString("en-PH",{maximumFractionDigits:3});
const num = v => { const n = parseFloat(String(v??"").replace(/,/g,"")); return isNaN(n) ? 0 : n; };
const d8 = v => v ? new Date(v).toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"2-digit"}) : "";
const dt = v => v ? new Date(v).toLocaleString("en-PH",{year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
const today = () => new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
const badge = s => `<span class="badge b-${esc(s)}">${esc(s)}</span>`;
const isAdmin = () => S.me?.role === "admin";
const isPurch = () => ["admin","purchasing"].includes(S.me?.role);
const canRequest = () => ["admin","purchasing","requester"].includes(S.me?.role);
const canReceive = () => ["admin","purchasing","receiver"].includes(S.me?.role);
const pname = id => S.profiles[id]?.full_name || S.profiles[id]?.email || "—";
const comp = id => S.companies.find(c => c.id === id) || {};
const myCompanies = () => isPurch() ? S.companies.filter(c=>c.active) : S.companies.filter(c => S.myCompanyIds.includes(c.id) && c.active);

function toast(msg, type=""){ const t=document.createElement("div"); t.className="toast "+type; t.textContent=msg; $("#toast").appendChild(t); setTimeout(()=>t.remove(), type==="err"?6500:3500); }
function errMsg(e){ return (e && (e.message || e.error_description || e.error)) || String(e); }
async function run(fn, okMsg){ try{ const r = await fn(); if(okMsg) toast(okMsg,"ok"); return r; } catch(e){ console.error(e); toast(errMsg(e),"err"); throw e; } }
function chk({data, error}){ if(error) throw error; return data; }
async function rpc(name, args){ return chk(await sb.rpc(name, args)); }

function modal({title, body, foot="", wide=false, onOpen}){
  const root = $("#modalRoot");
  const bg = document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML = `<div class="modal ${wide?"wide":""}"><header><h3>${esc(title)}</h3><button class="x" data-close>&times;</button></header><div class="body">${body}</div>${foot?`<footer>${foot}</footer>`:""}</div>`;
  root.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if(e.target===bg || e.target.closest("[data-close]")) close(); });
  if(onOpen) onOpen(bg, close);
  return {el:bg, close};
}
function ask(title, label, {required=true, placeholder=""}={}){
  return new Promise(res => {
    const m = modal({title, body:`<div class="fld"><label>${esc(label)}</label><textarea id="askT" placeholder="${esc(placeholder)}"></textarea></div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="askOk">OK</button>`,
      onOpen:(el,close)=>{ $("#askOk",el).onclick=()=>{ const v=$("#askT",el).value.trim(); if(required&&!v){toast("This is required.","err");return;} close(); res(v); }; $("#askT",el).focus(); el.addEventListener("click",e=>{ if(e.target.closest("[data-close]")) res(null); }); }});
  });
}
function confirmBox(title, text){
  return new Promise(res => { modal({title, body:`<p style="margin:0">${text}</p>`, foot:`<button class="btn" data-close id="cfNo">Cancel</button><button class="btn pri" id="cfYes">Confirm</button>`,
    onOpen:(el,close)=>{ $("#cfYes",el).onclick=()=>{close();res(true);}; $("#cfNo",el).onclick=()=>res(false); }}); });
}
function exportXlsx(rows, name){
  const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, name + "_" + today() + ".xlsx");
}
async function fetchAll(q){ // paginate past 1000-row cap
  let out=[], from=0; const size=1000;
  while(true){ const {data,error} = await q().range(from, from+size-1); if(error) throw error; out=out.concat(data); if(data.length<size) break; from+=size; }
  return out;
}

// =====================================================================
// AUTH
// =====================================================================
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#lgErr").textContent=""; $("#lgBtn").disabled=true;
  const {error} = await sb.auth.signInWithPassword({email:$("#lgEmail").value.trim(), password:$("#lgPass").value});
  $("#lgBtn").disabled=false;
  if(error){ $("#lgErr").textContent = error.message; return; }
  boot();
};
async function logout(){ await sb.auth.signOut(); location.hash=""; location.reload(); }

async function boot(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ $("#login").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  S.user = user;
  const {data:me} = await sb.from("pur_profiles").select("*").eq("user_id", user.id).maybeSingle();
  if(!me || !me.active){
    $("#login").classList.remove("hide");
    $("#lgErr").innerHTML = "Your account has no access to the Purchasing System yet. Please ask the Module Admin to add you.";
    await sb.auth.signOut(); return;
  }
  S.me = me;
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  await loadRefs();
  renderWho();
  if(user.user_metadata?.pur_must_change) changePassword(true);
  window.addEventListener("hashchange", route);
  route();
}
async function loadRefs(){
  const [c, uc, d, p, it, su] = await Promise.all([
    sb.from("pur_companies").select("*").order("code"),
    sb.from("pur_user_companies").select("company_id").eq("user_id", S.user.id),
    sb.from("pur_departments").select("*").order("name"),
    sb.from("pur_profiles").select("user_id,email,full_name,position,role,active"),
    fetchAll(()=>sb.from("pur_items").select("*").order("code")),
    fetchAll(()=>sb.from("pur_suppliers").select("*").order("name")),
  ]);
  S.companies = chk(c); S.myCompanyIds = chk(uc).map(r=>r.company_id); S.depts = chk(d);
  S.profiles = Object.fromEntries(chk(p).map(r=>[r.user_id, r]));
  S.items = it; S.suppliers = su;
}
async function refreshMasters(){
  S.items = await fetchAll(()=>sb.from("pur_items").select("*").order("code"));
  S.suppliers = await fetchAll(()=>sb.from("pur_suppliers").select("*").order("name"));
}
function renderWho(){
  $("#who").innerHTML = `<b>${esc(S.me.full_name||S.me.email)}</b><span class="small">${esc(S.me.email)}</span><br><span class="role">${esc(ROLE_LABEL[S.me.role])}</span>
    <div style="margin-top:8px"><a onclick="changePassword()">Change password</a><a onclick="logout()">Sign out</a></div>`;
}
function changePassword(forced=false){
  modal({title: forced ? "Please set a new password" : "Change password",
    body:`${forced?'<div class="note">Your password was set by the Module Admin. Choose your own password to continue. <b>Note:</b> this login is shared with the other Meatplus apps.</div>':'<div class="note info">This login is shared with the other Meatplus apps, so the new password applies there too.</div>'}
      <div class="fld" style="margin-bottom:10px"><label>New password</label><input type="password" id="np1"></div>
      <div class="fld"><label>Confirm password</label><input type="password" id="np2"></div>`,
    foot:`${forced?"":'<button class="btn" data-close>Cancel</button>'}<button class="btn pri" id="npOk">Save password</button>`,
    onOpen:(el,close)=>{
      if(forced) $(".x",el).remove();
      $("#npOk",el).onclick = async ()=>{
        const a=$("#np1",el).value, b=$("#np2",el).value;
        if(a.length<8) return toast("At least 8 characters.","err");
        if(a!==b) return toast("Passwords do not match.","err");
        await run(async()=>chk(await sb.auth.updateUser({password:a, data:{pur_must_change:false}})), "Password updated.");
        close();
      };
    }});
}

// =====================================================================
// NAV / ROUTER
// =====================================================================
const ROUTES = {
  dashboard:{t:"Dashboard", f:viewDashboard},
  pr:{t:"Purchase Requisitions", f:viewPRList}, "pr-edit":{t:"Purchase Requisition", f:viewPR},
  approvals:{t:"My Approvals", f:viewApprovals},
  canvass:{t:"Canvass / RFQ", f:viewCVList}, "cv-edit":{t:"Canvass / RFQ", f:viewCV},
  po:{t:"Purchase Orders", f:viewPOList}, "po-edit":{t:"Purchase Order", f:viewPO},
  rr:{t:"Receiving", f:viewRRList}, "rr-view":{t:"Receiving Report", f:viewRR},
  items:{t:"Item Master", f:()=>viewMaster("item")}, suppliers:{t:"Supplier Master", f:()=>viewMaster("supplier")},
  mreq:{t:"Master Data Requests", f:viewMasterRequests},
  setup:{t:"Setup", f:viewSetup},
};
async function navCounts(){
  const me = S.user.id;
  const [ap, mr] = await Promise.all([
    sb.from("pur_approvals").select("id",{count:"exact",head:true}).eq("approver_id",me).eq("status","pending"),
    isAdmin() ? sb.from("pur_master_requests").select("id",{count:"exact",head:true}).eq("status","pending") : Promise.resolve({count:0}),
  ]);
  S.counts = {ap: ap.count||0, mr: mr.count||0};
}
function renderNav(cur){
  const key = {"pr-edit":"pr","cv-edit":"canvass","po-edit":"po","rr-view":"rr"}[cur] || cur;
  const a = (r, label, ico, cnt) => `<a href="#${r}" class="${key===r?"on":""}"><span>${ico}</span>${label}${cnt?`<span class="cnt">${cnt}</span>`:""}</a>`;
  $("#nav").innerHTML = `
    ${a("dashboard","Dashboard","▦")}
    <div class="grp">Transactions</div>
    ${a("pr","Purchase Requisition","📝")}
    ${a("approvals","My Approvals","✔",S.counts.ap)}
    ${isPurch()?a("canvass","Canvass / RFQ","⚖"):""}
    ${a("po","Purchase Orders","📄")}
    ${a("rr","Receiving","📦")}

async function trailHtml(docId){
  const [{data:ap}, {data:act}] = await Promise.all([
    sb.from("pur_approvals").select("*").eq("doc_id",docId).order("round").order("step_no"),
    sb.from("pur_activity").select("*").eq("doc_id",docId).order("at"),
  ]);
  const rounds = [...new Set((ap||[]).map(a=>a.round))];
  let h = `<div class="card"><h3>Approval trail</h3>`;
  if(!ap?.length) h += `<div class="muted small">Not yet submitted.</div>`;
  rounds.forEach(r=>{
    if(rounds.length>1) h += `<div class="small bold" style="margin-top:6px">Submission #${r}</div>`;
    h += `<ul class="trail">` + ap.filter(a=>a.round===r).map(a=>`<li><b>Step ${a.step_no}</b> ${esc(a.step_name)} — ${esc(pname(a.approver_id))} ${badge(a.status)} <span class="muted small">${a.acted_at?dt(a.acted_at):""}</span> ${a.remarks?`<span class="small">“${esc(a.remarks)}”</span>`:""}</li>`).join("") + `</ul>`;
  });
  h += `</div><div class="card"><h3>History</h3>` + ((act||[]).length ? `<ul class="trail">${act.map(a=>`<li><b>${esc(a.action)}</b><span class="muted">${esc(a.details||"")}</span><span style="flex:1"></span><span class="small muted">${esc(pname(a.actor))} · ${dt(a.at)}</span></li>`).join("")}</ul>` : `<div class="muted small">—</div>`) + `</div>`;
  return {html:h, approvals:ap||[]};
}
function myPendingStep(approvals){
  const cur = approvals.filter(a=>a.status==="pending");
  if(!cur.length) return null;
  const maxRound = Math.max(...approvals.map(a=>a.round));
  const live = cur.filter(a=>a.round===maxRound);
  const minStep = Math.min(...live.map(a=>a.step_no));
  return live.find(a=>a.step_no===minStep && a.approver_id===S.user.id) || null;
}
async function decide(appr, decision, after){
  let remarks = "";
  if(decision==="reject"){ remarks = await ask("Reject", "Reason for rejecting (sent back to the preparer)"); if(remarks===null) return; }
  else { remarks = await ask("Approve", "Remarks (optional)", {required:false}); if(remarks===null) return; }
  await run(()=>rpc("pur_act",{p_approval_id:appr.id, p_decision:decision, p_remarks:remarks}), decision==="approve"?"Approved.":"Rejected.");
  after ? after() : route();
}
function approveButtons(appr){
  if(!appr) return "";
  return `<button class="btn ok" id="btnApprove">✔ Approve</button><button class="btn warn" id="btnReject">✖ Reject</button>`;
}
function wireApprove(appr){
  if(!appr) return;
  $("#btnApprove").onclick = ()=>decide(appr,"approve");
  $("#btnReject").onclick = ()=>decide(appr,"reject");
}

        <td class="row"><button class="btn sm ok" data-a="${a.id}" data-d="approve">Approve</button><button class="btn sm warn" data-a="${a.id}" data-d="reject">Reject</button></td></tr>`;}).join("")}

async function viewCV(id){
  const cv = chk(await sb.from("pur_canvasses").select("*, pr:pur_requisitions(*), company:pur_companies(*)").eq("id",id).single());
  const [lines, css, prices] = await Promise.all([
    sb.from("pur_pr_lines").select("*").eq("pr_id",cv.pr_id).order("line_no").then(chk),
    sb.from("pur_canvass_suppliers").select("*").eq("canvass_id",id).then(chk),
    sb.from("pur_canvass_prices").select("*").eq("canvass_id",id).then(chk),
  ]);
  const editable = cv.status==="draft" && isPurch();
  // local model
  const SUP = css.map(c=>({...c}));
  const P = {}; prices.forEach(p=>{ const cs=SUP.find(s=>s.id===p.cs_id); if(cs) P[cs.supplier_id+"|"+p.pr_line_id]=p.unit_price; });
  const AW = {}; prices.filter(p=>p.awarded).forEach(p=>{ const cs=SUP.find(s=>s.id===p.cs_id); if(cs) AW[p.pr_line_id]=cs.supplier_id; });
  const {data:pos} = await sb.from("pur_purchase_orders").select("id,po_no,status,total,supplier:pur_suppliers(name)").eq("canvass_id",id);
  const sname = sid => S.suppliers.find(s=>s.id===sid)?.name || "?";

  $("#view").innerHTML = `
    <div class="doc-head"><div><h3>${esc(cv.cv_no)}</h3><div class="muted small">For <a href="#pr-edit/${cv.pr_id}">${esc(cv.pr.pr_no)}</a> · ${esc(cv.company.code)} · ${esc(cv.pr.purpose||"")}</div></div>${badge(cv.status)}<div class="sp"></div>
      <div class="row">${editable?`<button class="btn" id="cAddS">＋ Add supplier</button><button class="btn" id="cLow">Award lowest per line</button><button class="btn" id="cSave">💾 Save</button><button class="btn pri" id="cAward">✔ Award & generate POs</button><button class="btn warn" id="cCancel">Cancel</button>`:""}
      <button class="btn" id="cPrint">🖨 Print abstract</button></div></div>
    ${editable?`<div class="note info">Add the suppliers who quoted, enter their unit prices, then tick the winning supplier for each line. Awarding creates one draft PO per winning supplier. Suppliers must already be approved in the Supplier Master.</div>`:""}
    <div class="card"><div class="tbl-wrap"><table class="t cv-grid" id="cvT"></table></div></div>
    ${(pos||[]).length?`<div class="card"><h3>Generated POs</h3><ul class="trail">${pos.map(p=>`<li><a href="#po-edit/${p.id}">${esc(p.po_no)}</a> ${esc(p.supplier?.name)} · ₱${money(p.total)} ${badge(p.status)}</li>`).join("")}</ul></div>`:""}`;

  const draw = ()=>{
    const lowest = {};
    lines.forEach(l=>{ let best=null; SUP.forEach(s=>{ const v=P[s.supplier_id+"|"+l.id]; if(v!==undefined&&v!==""&&(best===null||num(v)<best)) best=num(v); }); lowest[l.id]=best; });
    const tot = s => lines.reduce((a,l)=>{ const v=P[s.supplier_id+"|"+l.id]; return a+(v!==undefined&&v!==""?num(v)*num(l.qty):0); },0);
    const awTot = s => lines.reduce((a,l)=>AW[l.id]===s.supplier_id?a+num(P[s.supplier_id+"|"+l.id])*num(l.qty):a,0);
    $("#cvT").innerHTML = `<thead><tr><th>Item</th><th>Qty</th>${SUP.map((s,i)=>`<th style="min-width:150px">${esc(sname(s.supplier_id))}${editable?` <button class="btn link sm" data-rs="${i}" title="Remove">✕</button>`:""}</th>`).join("")}</tr>
      <tr><th class="small">Terms / lead time / quote ref</th><th></th>${SUP.map((s,i)=>editable?`<th style="white-space:normal;text-transform:none;font-weight:400"><div style="display:flex;flex-direction:column;gap:4px;max-width:200px;margin:auto"><input class="inp" data-si="${i}" data-k="payment_terms" placeholder="Terms" value="${esc(s.payment_terms||"")}"><input class="inp" data-si="${i}" data-k="lead_time" placeholder="Lead time" value="${esc(s.lead_time||"")}"><input class="inp" data-si="${i}" data-k="quote_ref" placeholder="Quote ref" value="${esc(s.quote_ref||"")}"></div></th>`:`<th class="small" style="font-weight:400;text-transform:none">${esc(s.payment_terms||"")}<br>${esc(s.lead_time||"")}<br>${esc(s.quote_ref||"")}</th>`).join("")}</tr></thead>
      <tbody>${lines.map(l=>`<tr><td><b>${esc(l.description)}</b><div class="small muted">Est. ₱${money(l.est_unit_cost)} / ${esc(l.uom)}</div></td><td>${qtyf(l.qty)} ${esc(l.uom)}</td>
        ${SUP.map(s=>{ const k=s.supplier_id+"|"+l.id, v=P[k]; const low = v!==undefined&&v!==""&&num(v)===lowest[l.id];
          return `<td class="${low?"low":""}">${editable?`<input class="inp right" data-p="${k}" value="${v??""}" style="width:110px" inputmode="decimal"><label class="chk" style="justify-content:center;margin-top:4px"><input type="radio" name="aw_${l.id}" data-aw="${l.id}" value="${s.supplier_id}" ${AW[l.id]===s.supplier_id?"checked":""}> award</label>`
            : `${v!==undefined?money(v):"—"} ${AW[l.id]===s.supplier_id?"<div>🏆 <b>awarded</b></div>":""}`}</td>`; }).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>Total quoted</td><td></td>${SUP.map(s=>`<td>${money(tot(s))}</td>`).join("")}</tr><tr><td>Total awarded</td><td></td>${SUP.map(s=>`<td>${money(awTot(s))}</td>`).join("")}</tr></tfoot>`;
    if(!SUP.length) $("#cvT").innerHTML += `<tbody><tr><td colspan="3" class="empty">Add the suppliers who submitted quotations.</td></tr></tbody>`;
  };
  draw();
  if(editable){
    $("#cvT").addEventListener("input", e=>{ const k=e.target.dataset.p; if(k){ P[k]=e.target.value; } const si=e.target.dataset.si; if(si!==undefined) SUP[+si][e.target.dataset.k]=e.target.value; });
    $("#cvT").addEventListener("change", e=>{ if(e.target.dataset.aw){ AW[e.target.dataset.aw]=e.target.value; } if(e.target.dataset.p) draw(); });
    $("#cvT").addEventListener("click", e=>{ const r=e.target.dataset.rs; if(r!==undefined){ const s=SUP.splice(+r,1)[0]; lines.forEach(l=>{ delete P[s.supplier_id+"|"+l.id]; if(AW[l.id]===s.supplier_id) delete AW[l.id]; }); draw(); } });
    $("#cAddS").onclick = ()=>modal({title:"Add supplier", body:`<div class="fld"><label>Supplier</label><select id="asS"><option value="">— select —</option>${supplierOptions()}</select></div><div class="small muted" style="margin-top:8px">Missing supplier? <a href="javascript:void 0" id="asReq">Request a new supplier</a> — the Module Admin must approve it first.</div>`,
      foot:`<button class="btn" data-close>Cancel</button><button class="btn pri" id="asOk">Add</button>`,
      onOpen:(el,close)=>{ $("#asReq",el).onclick=()=>{close();masterRequestForm("supplier","create");}; $("#asOk",el).onclick=()=>{ const v=$("#asS",el).value; if(!v) return; if(SUP.some(s=>s.supplier_id===v)) return toast("Already added.","err"); const sp=S.suppliers.find(s=>s.id===v); SUP.push({supplier_id:v,payment_terms:sp?.payment_terms||"",lead_time:"",quote_ref:""}); close(); draw(); }; }});
    $("#cLow").onclick = ()=>{ lines.forEach(l=>{ let best=null,bs=null; SUP.forEach(s=>{ const v=P[s.supplier_id+"|"+l.id]; if(v!==undefined&&v!==""&&(best===null||num(v)<best)){best=num(v);bs=s.supplier_id;} }); if(bs) AW[l.id]=bs; }); draw(); };
    const save = async ()=>{
      // suppliers
      const keep = SUP.filter(s=>s.id).map(s=>s.id);
      const old = css.map(c=>c.id).filter(x=>!keep.includes(x));
      if(old.length) chk(await sb.from("pur_canvass_suppliers").delete().in("id",old));
      for(const s of SUP){
        const row = {canvass_id:id, supplier_id:s.supplier_id, payment_terms:s.payment_terms||"", lead_time:s.lead_time||"", quote_ref:s.quote_ref||""};
        if(s.id) chk(await sb.from("pur_canvass_suppliers").update(row).eq("id",s.id));
        else s.id = chk(await sb.from("pur_canvass_suppliers").insert(row).select("id").single()).id;
      }
      chk(await sb.from("pur_canvass_prices").delete().eq("canvass_id",id));
      const rows=[]; SUP.forEach(s=>lines.forEach(l=>{ const v=P[s.supplier_id+"|"+l.id]; if(v!==undefined&&v!=="") rows.push({canvass_id:id,cs_id:s.id,pr_line_id:l.id,unit_price:num(v),awarded:AW[l.id]===s.supplier_id}); }));
      const awardedNoPrice = lines.filter(l=>AW[l.id] && (P[AW[l.id]+"|"+l.id]===undefined || P[AW[l.id]+"|"+l.id]===""));
      if(awardedNoPrice.length) throw new Error("An awarded supplier has no price for: "+awardedNoPrice.map(l=>l.description).join(", "));
      if(rows.length) chk(await sb.from("pur_canvass_prices").insert(rows));
      return true;
    };
    $("#cSave").onclick = async ()=>{ await run(save,"Canvass saved."); route(); };
    $("#cAward").onclick = async ()=>{
      if(!await confirmBox("Award canvass","This locks the canvass and creates a draft PO for each winning supplier. Continue?")) return;
      const ok = await run(save); if(!ok) return;
      const n = await run(()=>rpc("pur_award_canvass",{p_cv:id})); if(n!==undefined){ toast(n+" draft PO(s) created.","ok"); route(); }
    };
    $("#cCancel").onclick = async ()=>{ const r=await ask("Cancel canvass","Reason"); if(!r) return; await run(()=>rpc("pur_cancel",{p_doc_type:"CV",p_id:id,p_reason:r}),"Canvass cancelled."); go("canvass"); };
  }
  $("#cPrint").onclick = ()=>printCanvass(cv, lines, SUP, P, AW);
}

    ${(rrs||[]).length?`<div class="card"><h3>Receiving reports</h3><ul class="trail">${rrs.map(r=>`<li><a href="#rr-view/${r.id}">${esc(r.rr_no)}</a> ${d8(r.received_date)} · DR ${esc(r.dr_no||"—")} · SI ${esc(r.invoice_no||"—")} · by ${esc(pname(r.received_by))}</li>`).join("")}</ul></div>`:""}
    ${tr.html}`;
  const manual = editable && !po.pr_id;
  const calc = ()=>{ const s=L.reduce((a,l)=>a+Math.round(num(l.qty)*num(l.unit_price)*100)/100,0); const v=$("#oVat")?.value||po.vat_type;
    let sub=s,vat=0,tot=s; if(v==="VAT-EXCLUSIVE"){vat=Math.round(s*12)/100;tot=s+vat;} else if(v==="VAT-INCLUSIVE"){vat=Math.round(s*12/112*100)/100;sub=s-vat;}
    $("#tSub").textContent=money(sub); $("#tVat").textContent=money(vat); $("#tTot").textContent=money(tot); };
  const draw = ()=>{
    $("#poLines tbody").innerHTML = L.map((l,i)=>editable?`<tr data-i="${i}"><td>${i+1}</td>
      <td>${manual?`<input class="inp li-item" list="dlItems" value="${esc(l.description?((S.items.find(x=>x.id===l.item_id)?.code||"")+" — "+l.description):"")}">`:esc(l.description)}</td><td>${esc(l.uom)}</td>
      <td class="num"><input class="inp right li-qty" value="${l.qty}" style="width:90px"></td><td class="num"><input class="inp right li-pr" value="${l.unit_price}" style="width:110px"></td>
      <td class="num li-amt">${money(num(l.qty)*num(l.unit_price))}</td><td class="num">${qtyf(l.qty_received)}</td>${manual?`<td><button class="btn sm warn li-del">✕</button></td>`:""}</tr>`
      : `<tr><td>${i+1}</td><td>${esc(l.description)}</td><td>${esc(l.uom)}</td><td class="num">${qtyf(l.qty)}</td><td class="num">${money(l.unit_price)}</td><td class="num">${money(l.amount)}</td><td class="num">${qtyf(l.qty_received)}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">No lines.</td></tr>`;
    calc();
  };
  draw();
  if(editable){
    const tb=$("#poLines tbody");
    tb.addEventListener("input",e=>{ const tr=e.target.closest("tr"); if(!tr) return; const l=L[+tr.dataset.i];
      if(e.target.classList.contains("li-qty")) l.qty=e.target.value; if(e.target.classList.contains("li-pr")) l.unit_price=e.target.value;
      $(".li-amt",tr).textContent=money(num(l.qty)*num(l.unit_price)); calc(); });
    tb.addEventListener("change",e=>{ if(!e.target.classList.contains("li-item")) return; const l=L[+e.target.closest("tr").dataset.i]; const it=itemFromText(e.target.value);
      if(it){ l.item_id=it.id; l.description=it.description; l.uom=it.uom; if(!num(l.unit_price)) l.unit_price=it.last_price||0; } else { l.item_id=null; toast("Pick an item from the Item Master.","err"); } setTimeout(draw,0); });
    tb.addEventListener("click",e=>{ if(e.target.classList.contains("li-del")){ L.splice(+e.target.closest("tr").dataset.i,1); draw(); }});
    $("#oVat").onchange=calc;
    if($("#oAdd")) $("#oAdd").onclick=()=>{ L.push({item_id:null,description:"",uom:"PC",qty:1,unit_price:0,qty_received:0}); draw(); };
    const save = async ()=>{
      if(L.some(l=>!l.item_id)) throw new Error("Every line must use an item from the Item Master.");
      if(L.some(l=>num(l.qty)<=0)) throw new Error("Quantity must be more than zero.");
      if(po.pr_id){ const {data:prl} = await sb.from("pur_pr_lines").select("id,qty").eq("pr_id",po.pr_id); const m=Object.fromEntries((prl||[]).map(x=>[x.id,num(x.qty)]));
        const over=L.find(l=>l.pr_line_id && num(l.qty)>m[l.pr_line_id]); if(over) throw new Error(`Qty for "${over.description}" is more than the PR qty (${m[over.pr_line_id]}).`); }
      chk(await sb.from("pur_purchase_orders").update({po_date:$("#oDate").value||today(), delivery_date:$("#oDel8").value||null, payment_terms:$("#oTerms").value, vat_type:$("#oVat").value, delivery_address:$("#oAddr").value, remarks:$("#oRem").value}).eq("id",id));
      if(manual){
        chk(await sb.from("pur_po_lines").delete().eq("po_id",id));
        if(L.length) chk(await sb.from("pur_po_lines").insert(L.map((l,i)=>({po_id:id,line_no:i+1,item_id:l.item_id,description:l.description,uom:l.uom,qty:num(l.qty),unit_price:num(l.unit_price)}))));
      } else {
        for(const l of L) chk(await sb.from("pur_po_lines").update({qty:num(l.qty),unit_price:num(l.unit_price)}).eq("id",l.id));
      }
      return true;
    };
    $("#oSave").onclick = async()=>{ await run(save,"Saved."); route(); };
    $("#oSubmit").onclick = async()=>{ if(!L.length) return toast("Add at least one line.","err"); const ok=await run(save); if(!ok) return; try{ await rpc("pur_submit",{p_doc_type:"PO",p_id:id}); toast("PO submitted for approval.","ok"); }catch(e){ toast(errMsg(e),"err"); } route(); };
    if($("#oDel")) $("#oDel").onclick = async()=>{ if(!await confirmBox("Delete PO","Delete this draft PO?")) return; await run(async()=>chk(await sb.from("pur_purchase_orders").delete().eq("id",id)),"Deleted."); go("po"); };
  }
  if($("#oSent")) $("#oSent").onclick = async()=>{ await run(()=>rpc("pur_mark_sent",{p_po:id}),"Marked as sent."); route(); };
  if($("#oCancel")) $("#oCancel").onclick = async()=>{ const r=await ask("Cancel PO","Reason for cancelling"); if(!r) return; await run(()=>rpc("pur_cancel",{p_doc_type:"PO",p_id:id,p_reason:r}),"PO cancelled."); route(); };
  if($("#oRecv")) $("#oRecv").onclick = ()=>receiveForm(po, lines);
  $("#oPrint").onclick = ()=>printPO(po, lines, tr.approvals);
  wireApprove(myAppr);
}

async function viewMaster(kind){

  $("#view").innerHTML = `

      ${rows.slice(0,1000).map(r=>`<tr>${cols.map(c=>`<td class="${c==="last_price"?"num":""}">${c==="last_price"?money(r[c]):esc(r[c])}</td>`).join("")}<td>${badge(r.status)} ${pendSet.has(r.id)?'<span class="badge b-pending">change pending</span>':""}</td>
        <td class="row" style="flex-wrap:nowrap">${S.me.role!=="viewer"&&!pendSet.has(r.id)?`<button class="btn sm" data-ed="${r.id}">${isAdmin()?"Edit":"Request change"}</button><button class="btn sm ${r.status==="active"?"warn":""}" data-tg="${r.id}">${r.status==="active"?"Deactivate":"Activate"}</button>`:""}</td></tr>`).join("")}
      </tbody></table></div>${rows.length>1000?`<div class="small muted">Showing first 1000 of ${rows.length}. Refine your search.</div>`:""}` : `<div class="card empty">No records.</div>`;
    $$("[data-ed]").forEach(b=>b.onclick=()=>masterRequestForm(kind,"update",list.find(r=>r.id===b.dataset.ed)));

async function masterToggle(kind, r){
  const action = r.status==="active" ? "deactivate" : "activate";
  if(isAdmin()){
    if(!await confirmBox(action==="activate"?"Activate":"Deactivate", `${action==="activate"?"Activate":"Deactivate"} <b>${esc(r.description||r.name)}</b>?`)) return;
    await run(async()=>chk(await sb.from(kind==="item"?"pur_items":"pur_suppliers").update({status:action==="activate"?"active":"inactive"}).eq("id",r.id)),"Updated.");
  } else {
    const reason = await ask(`Request to ${action}`, "Reason"); if(!reason) return;
    await run(()=>rpc("pur_master_request",{p_kind:kind,p_action:action,p_target:r.id,p_payload:{},p_reason:reason}),"Request sent to the Module Admin.");
  }
  route();
}
function masterRequestForm(kind, action, rec){
  const f = MF[kind]; const isItem = kind==="item"; const direct = isAdmin();

  modal({title:`${direct?(action==="create"?"Add":"Edit"):(action==="create"?"Request new":"Request change to")} ${isItem?"item":"supplier"}`,
    body:`${direct?"":`<div class="note info">This request goes to the Module Admin. The ${isItem?"item":"supplier"} can be used once approved.</div>`}
      <div class="grid">${f.map(x=>`<div class="fld" ${x.ta?'style="grid-column:1/-1"':""}><label>${esc(x.l)}${x.req?" *":""}</label>${
        x.opt?`<select data-k="${x.k}">${x.opt.map(o=>`<option ${o===val(x.k)?"selected":""}>${o}</option>`).join("")}</select>`
        : x.ta?`<textarea data-k="${x.k}">${esc(val(x.k))}</textarea>`
        : `<input data-k="${x.k}" value="${esc(val(x.k))}" ${x.k==="code"&&rec?"disabled":""} ${x.n?'inputmode="decimal"':""}>`}</div>`).join("")}</div>
      ${direct?"":`<div class="fld" style="margin-top:12px"><label>Reason / justification *</label><textarea id="mrWhy"></textarea></div>`}`,

        if(!r) return;

      close(); await refreshMasters(); if(location.hash.startsWith("#items")||location.hash.startsWith("#suppliers")||location.hash.startsWith("#mreq")) route();

}

function pdfHeader(doc, co, title, docNo){
  const W = doc.internal.pageSize.getWidth();
  let x = 14;
  if(co.logo){ try{ const fmt = co.logo.includes("image/jpeg")?"JPEG":"PNG"; const p=doc.getImageProperties(co.logo); const h=16, w=Math.min(40,p.width*h/p.height); doc.addImage(co.logo, fmt, 14, 10, w, h); x = 14 + w + 4; }catch(e){} }
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text(co.name||"", x, 15);
  doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.text(doc.splitTextToSize(co.address||"", 110), x, 20);
  if(co.tin) doc.text("TIN: "+co.tin, x, 28);
  doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(200,16,46); doc.text(title, W-14, 15, {align:"right"});
  doc.setTextColor(0); doc.setFontSize(11); doc.text(docNo||"", W-14, 21, {align:"right"});
  doc.setDrawColor(200,16,46); doc.setLineWidth(0.6); doc.line(14, 32, W-14, 32);
  return 38;
}
function kv(doc, pairs, y){
  const W = doc.internal.pageSize.getWidth(); const colW = (W-28)/2;
  doc.setFontSize(9);
  pairs.forEach((p,i)=>{ const cx = 14 + (i%2)*colW, cy = y + Math.floor(i/2)*5.5;
    doc.setFont("helvetica","bold"); doc.text(p[0]+":", cx, cy); doc.setFont("helvetica","normal"); doc.text(doc.splitTextToSize(String(p[1]??""), colW-32)[0]||"", cx+30, cy); });
  return y + Math.ceil(pairs.length/2)*5.5 + 2;
}
function signBlock(doc, sigs, y){
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  if(y > H-40){ doc.addPage(); y = 20; }
  const n = Math.max(sigs.length,1), w = (W-28)/n;
  doc.setFontSize(8.5);
  sigs.forEach((s,i)=>{ const cx = 14 + i*w;
    doc.setFont("helvetica","normal"); doc.text(s[0], cx, y);
    doc.setFont("helvetica","bold"); doc.text(s[1]||"", cx, y+12);
    doc.setLineWidth(0.2); doc.line(cx, y+13, cx+w-8, y+13);
    doc.setFont("helvetica","normal"); doc.text(s[2]||"", cx, y+17); });
}
const TBL = {theme:"grid", headStyles:{fillColor:[200,16,46], fontSize:8.5}, styles:{fontSize:8.5, cellPadding:1.6}, margin:{left:14,right:14}};
function approvedSigs(approvals){
  const maxR = Math.max(0,...approvals.map(a=>a.round));
  return approvals.filter(a=>a.round===maxR && a.status==="approved").map(a=>[a.step_name||("Approver "+a.step_no), pname(a.approver_id), "Approved "+d8(a.acted_at)]);
}
function printPR(pr, lines, approvals){
  const {jsPDF} = window.jspdf; const doc = new jsPDF();
  let y = pdfHeader(doc, comp(pr.company_id), "PURCHASE REQUISITION", pr.pr_no);
  y = kv(doc, [["Department", pr.dept?.name||""],["Date", d8(pr.request_date)],["Requested by", pname(pr.requested_by)],["Date needed", d8(pr.date_needed)],["Priority", pr.priority],["Status", pr.status.toUpperCase()]], y);
  doc.setFont("helvetica","bold"); doc.text("Purpose:", 14, y+2); doc.setFont("helvetica","normal"); const pl = doc.splitTextToSize(pr.purpose||"", 160); doc.text(pl, 30, y+2); y += 4 + pl.length*4;
  doc.autoTable({...TBL, startY:y, head:[["#","Item code","Description","UOM","Qty","Est. unit cost","Amount","Remarks"]],
    body: lines.map((l,i)=>[i+1, S.items.find(x=>x.id===l.item_id)?.code||"", l.description, l.uom, qtyf(l.qty), money(l.est_unit_cost), money(l.amount), l.remarks||""]),
    foot:[["","","","","","TOTAL", money(pr.total), ""]], footStyles:{fillColor:[245,245,245], textColor:20, fontStyle:"bold"},
    columnStyles:{4:{halign:"right"},5:{halign:"right"},6:{halign:"right"}}});
  signBlock(doc, [["Requested by", pname(pr.requested_by), d8(pr.submitted_at||pr.request_date)], ...approvedSigs(approvals)].slice(0,4), doc.lastAutoTable.finalY + 16);
  doc.save(pr.pr_no + ".pdf");
}
function printPO(po, lines, approvals){
  const {jsPDF} = window.jspdf; const doc = new jsPDF(); const s = po.supplier;
  let y = pdfHeader(doc, po.company, "PURCHASE ORDER", po.po_no);
  y = kv(doc, [["Supplier", s.name],["PO date", d8(po.po_date)],["Address", s.address||""],["Delivery date", d8(po.delivery_date)],["TIN", s.tin||""],["Terms", po.payment_terms||""],["Contact", [s.contact_person,s.phone].filter(Boolean).join(" / ")],["PR ref.", po.pr?.pr_no||"—"]], y);
  doc.setFont("helvetica","bold"); doc.text("Deliver to:", 14, y+2); doc.setFont("helvetica","normal"); const al=doc.splitTextToSize(po.delivery_address||"",160); doc.text(al, 34, y+2); y += 4 + al.length*4;
  doc.autoTable({...TBL, startY:y, head:[["#","Description","UOM","Qty","Unit price","Amount"]],
    body: lines.map((l,i)=>[i+1, l.description, l.uom, qtyf(l.qty), money(l.unit_price), money(l.amount)]),
    foot:[["","","","",po.vat_type==="VAT-INCLUSIVE"?"Net of VAT":"Subtotal", money(po.subtotal)],["","","","","VAT 12%", money(po.vat_amount)],["","","","","TOTAL", money(po.total)]],
    footStyles:{fillColor:[245,245,245], textColor:20, fontStyle:"bold"}, columnStyles:{3:{halign:"right"},4:{halign:"right"},5:{halign:"right"}}});
  let fy = doc.lastAutoTable.finalY + 6;
  doc.setFontSize(8.5); doc.text(`VAT: ${po.vat_type}`, 14, fy);
  if(po.remarks){ const rl=doc.splitTextToSize("Remarks: "+po.remarks, 180); doc.text(rl, 14, fy+5); fy += rl.length*4; }
  doc.setFontSize(7.5); doc.text(doc.splitTextToSize("Please indicate the PO number on your delivery receipt and sales invoice. Deliveries not matching this PO may be refused.",180), 14, fy+9);
  signBlock(doc, [["Prepared by", pname(po.created_by), "Purchasing"], ...approvedSigs(approvals), ["Conforme (Supplier)", "", "Signature over printed name / date"]].slice(0,4), fy + 22);
  doc.save(po.po_no + ".pdf");
}
function printRR(rr, lines){
  const {jsPDF} = window.jspdf; const doc = new jsPDF();
  let y = pdfHeader(doc, rr.company, "RECEIVING REPORT", rr.rr_no);
  y = kv(doc, [["Supplier", rr.po.supplier.name],["Date received", d8(rr.received_date)],["PO no.", rr.po.po_no],["DR no.", rr.dr_no||""],["Received by", pname(rr.received_by)],["Sales invoice", rr.invoice_no||""]], y);
  doc.autoTable({...TBL, startY:y+2, head:[["#","Description","UOM","Ordered","Received","Rejected","Remarks"]],
    body: lines.map((l,i)=>[i+1, l.pol.description, l.pol.uom, qtyf(l.pol.qty), qtyf(l.qty_received), qtyf(l.qty_rejected), l.remarks||""]),
    columnStyles:{3:{halign:"right"},4:{halign:"right"},5:{halign:"right"}}});
  let fy = doc.lastAutoTable.finalY + 6;
  if(rr.remarks){ doc.setFontSize(8.5); const rl=doc.splitTextToSize("Remarks: "+rr.remarks,180); doc.text(rl,14,fy); fy+=rl.length*4; }
  signBlock(doc, [["Received by", pname(rr.received_by), d8(rr.received_date)],["Checked by","",""],["Delivered by (Supplier)","",""]], fy + 14);
  doc.save(rr.rr_no + ".pdf");
}
function printCanvass(cv, lines, SUP, P, AW){
  const {jsPDF} = window.jspdf; const doc = new jsPDF({orientation:"landscape"});
  const sname = sid => S.suppliers.find(s=>s.id===sid)?.name || "?";
  let y = pdfHeader(doc, cv.company, "ABSTRACT OF CANVASS", cv.cv_no);
  y = kv(doc, [["PR no.", cv.pr.pr_no],["Date", d8(cv.created_at)],["Purpose", cv.pr.purpose||""],["Status", cv.status.toUpperCase()]], y);
  const head = [["Item","Qty", ...SUP.map(s=>sname(s.supplier_id))]];
  const body = lines.map(l=>[l.description, qtyf(l.qty)+" "+l.uom, ...SUP.map(s=>{ const v=P[s.supplier_id+"|"+l.id]; return (v!==undefined&&v!==""?money(v):"—") + (AW[l.id]===s.supplier_id?"  *":""); })]);
  body.push(["Total quoted","", ...SUP.map(s=>money(lines.reduce((a,l)=>{ const v=P[s.supplier_id+"|"+l.id]; return a+(v!==undefined&&v!==""?num(v)*num(l.qty):0); },0)))]);
  body.push(["Terms / lead time","", ...SUP.map(s=>[s.payment_terms,s.lead_time].filter(Boolean).join(" / "))]);
  doc.autoTable({...TBL, startY:y+2, head, body});
  doc.setFontSize(8); doc.text("* awarded supplier", 14, doc.lastAutoTable.finalY+5);
  signBlock(doc, [["Canvassed by", pname(cv.created_by), "Purchasing"],["Reviewed by","",""],["Approved by","",""]], doc.lastAutoTable.finalY + 18);
  doc.save(cv.cv_no + ".pdf");
}
